name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK langsung via Gradle (bypass flutter build)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          _JAVA_OPTIONS: "-Xmx3g -Xms512m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      - name: Cari file APK yang dihasilkan
        run: |
          echo "=== Mencari APK ==="
          find . -name "*.apk" -not -path "*/cache/*" 2>/dev/null
          echo "=== Selesai ==="

      - name: Rename dan pindah APK
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          # Coba beberapa path output yang mungkin
          APK_SRC=""
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            echo "APK tidak ditemukan di path manapun!"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SRC" "dist/mobile-vms-${TIMESTAMP}.apk"
          echo "APK_PATH=dist/mobile-vms-${TIMESTAMP}.apk" >> $GITHUB_ENV
          echo "APK ditemukan di: $APK_SRC"
          echo "APK disalin ke: dist/mobile-vms-${TIMESTAMP}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-vms-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Build Sukses ✅" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ env.APK_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Download APK di tab **Actions → Artifacts**.' >> $GITHUB_STEP_SUMMARY

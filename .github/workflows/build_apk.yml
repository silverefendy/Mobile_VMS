name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version
          echo "Gradle wrapper: $(cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl)"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=ENABLE_API_LOG=false \
            --dart-define=ENABLE_SIGNED_QR=false
        env:
          # Override JVM heap untuk Gradle di CI — mencegah Java heap space error
          _JAVA_OPTIONS: "-Xmx3g -Xms512m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      - name: Rename APK with timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/mobile-vms-${TIMESTAMP}.apk
          echo "APK_NAME=mobile-vms-${TIMESTAMP}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-vms-apk
          path: build/app/outputs/flutter-apk/mobile-vms-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Build Sukses ✅" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ env.APK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Download APK di tab **Actions → Artifacts**.' >> $GITHUB_STEP_SUMMARY

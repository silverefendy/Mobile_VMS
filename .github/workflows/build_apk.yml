name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Generate gradle wrapper jar jika tidak ada
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating gradle wrapper..."
            cd android && gradle wrapper --gradle-version 8.14.1 && cd ..
          fi
        env:
          _JAVA_OPTIONS: "-Xmx1g"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Pastikan debug.keystore tersedia untuk signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore dibuat."
          else
            echo "debug.keystore sudah ada."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=ENABLE_API_LOG=false \
            --dart-define=ENABLE_SIGNED_QR=false
        env:
          _JAVA_OPTIONS: "-Xmx3g -Xms512m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      - name: Cari APK yang dihasilkan
        if: always()
        run: |
          echo "=== Daftar semua APK ==="
          find . -name "*.apk" -not -path "*/cache/*" 2>/dev/null || echo "Tidak ada APK"

      - name: Rename dan pindah APK
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          APK_SRC=""
          for P in \
            "build/app/outputs/flutter-apk/app-release.apk" \
            "android/app/build/outputs/apk/release/app-release.apk" \
            "android/app/build/outputs/apk/release/app-release-unsigned.apk"; do
            if [ -f "$P" ]; then
              APK_SRC="$P"
              break
            fi
          done
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SRC" "dist/mobile-vms-${TIMESTAMP}.apk"
          echo "APK_PATH=dist/mobile-vms-${TIMESTAMP}.apk" >> $GITHUB_ENV
          echo "Sukses: $APK_SRC -> dist/mobile-vms-${TIMESTAMP}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-vms-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Build Sukses ✅" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ env.APK_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Download APK di tab **Actions → Artifacts**.' >> $GITHUB_STEP_SUMMARY

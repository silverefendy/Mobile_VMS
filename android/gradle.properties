# Gradle JVM — naikkan heap agar Jetify transform tidak OOM
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false

# AndroidX sudah wajib — Jetifier tidak diperlukan lagi
# Mematikan Jetifier menghilangkan JetifyTransform yang crash karena heap
android.useAndroidX=true
android.enableJetifier=false
